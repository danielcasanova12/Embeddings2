# configs/experiments/ab4_ex1_reliability_all.yaml
defaults: [/model]
experiment_name: "ab4_ex1_reliability_all"
model_type: "reliability_fusion"
embeddings:
  - {name: "semantic",  column: "whisper_path",    dim: 1280}
  - {name: "content",   column: "contentvec_path", dim: 768}
  - {name: "acoustic",  column: "speaker_path",    dim: 192}
  - {name: "f0",        column: "f0_path",         dim: 1}
adapter:
  adapter_dim: 256
reliability:
  factor_names: ["semantic", "content", "acoustic", "f0"]
  factor_weight: 0.1
mlp:
  hidden_dim: 256
  num_layers: 2
