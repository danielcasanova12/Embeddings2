defaults: [/model]
experiment_name: "exp7_ex4_weighted_top3"
model_type: "weighted_fusion"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
  - {name: "contentvec", column: "contentvec_path", dim: 768}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
