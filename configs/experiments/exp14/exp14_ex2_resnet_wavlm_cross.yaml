# exp14: ResNet-50 (2D) + WavLM (1D) - cross interaction
# Hipotese: atencao cruzada entre features espectrais e representacao SSL
defaults: [/model]
experiment: "exp14_ex2_resnet_wavlm_cross"
model_type: "cross_interaction"
embeddings:
  - {name: "resnet50",   column: "resnet50_path",   dim: 2048}
  - {name: "wavlm",      column: "wavlm_path",      dim: 768}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
