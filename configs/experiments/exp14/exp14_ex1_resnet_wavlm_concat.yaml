# exp14: ResNet-50 (2D) + WavLM (1D SSL) - concat fusion
# Hipotese: 2D captura artefatos locais (ruido, compressao) + 1D captura conteudo
defaults: [/model]
experiment: "exp14_ex1_resnet_wavlm_concat"
model_type: "concat_fusion"
embeddings:
  - {name: "resnet50",   column: "resnet50_path",   dim: 2048}
  - {name: "wavlm",      column: "wavlm_path",      dim: 768}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
