# exp14: AST (2D) + WavLM (1D) - cross interaction
defaults: [/model]
experiment: "exp14_ex4_ast_wavlm_cross"
model_type: "cross_interaction"
embeddings:
  - {name: "ast",        column: "ast_path",        dim: 768}
  - {name: "wavlm",      column: "wavlm_path",      dim: 768}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
