# configs/experiments/ab2_ex1_cross_all.yaml
defaults: [/model]
experiment_name: "ab2_ex1_cross_all"
model_type: "cross_interaction"
embeddings:
  - {name: "semantic",  column: "whisper_path",    dim: 1280}
  - {name: "content",   column: "contentvec_path", dim: 768}
  - {name: "acoustic",  column: "speaker_path",    dim: 192}
  - {name: "f0",        column: "f0_path",         dim: 1}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 3
