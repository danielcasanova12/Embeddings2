defaults: [/model]
experiment_name: "exp6_ex2_content_speaker_cross"
model_type: "cross_interaction"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "contentvec", column: "contentvec_path", dim: 768}
  - {name: "hubert",     column: "hubert_path",     dim: 768}
  - {name: "wavlm",      column: "wavlm_path",      dim: 768}
  - {name: "wav2vec2",   column: "wav2vec2_path",   dim: 768}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 3
