# configs/experiments/ab3/ab3_ex1_all.yaml
defaults: [/model]
experiment_name: "ab3_ex1_all"
model_type: "concat_fusion"
embeddings:
  - {name: "semantic",  column: "whisper_path",    dim: 1280}
  - {name: "content",   column: "contentvec_path", dim: 768}
  - {name: "acoustic",  column: "speaker_path",    dim: 192}
  - {name: "f0",        column: "f0_path",         dim: 256}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 3