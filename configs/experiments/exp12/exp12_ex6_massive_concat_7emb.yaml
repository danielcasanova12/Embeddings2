# exp12: Fusao massiva (todos 7 concat) - baseline para comparar com cross_ws
# Hipotese: cross_ws (2 embeddings) supera ou iguala este com 7 embeddings
defaults: [/model]
experiment: "exp12_ex6_massive_concat_7emb"
model_type: "concat_fusion"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
  - {name: "contentvec", column: "contentvec_path", dim: 768}
  - {name: "hubert",     column: "hubert_path",     dim: 768}
  - {name: "wavlm",      column: "wavlm_path",      dim: 768}
  - {name: "wav2vec2",   column: "wav2vec2_path",   dim: 768}
  - {name: "f0",         column: "f0_path",         dim: 1}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
