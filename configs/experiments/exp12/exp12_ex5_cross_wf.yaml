# exp12: Cross Whisper + F0 - semantico x prosodia (sem speaker)
defaults: [/model]
experiment: "exp12_ex5_cross_wf"
model_type: "cross_interaction"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "f0",         column: "f0_path",         dim: 1}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
