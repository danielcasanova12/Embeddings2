# exp12: Baseline Concat Whisper + Speaker - comparacao direta com cross_ws
defaults: [/model]
experiment: "exp12_ex2_concat_ws"
model_type: "concat_fusion"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
