# exp12: Baseline Concat Whisper + Speaker + F0
defaults: [/model]
experiment: "exp12_ex4_concat_wsf"
model_type: "concat_fusion"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
  - {name: "f0",         column: "f0_path",         dim: 1}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
