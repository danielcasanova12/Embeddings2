# exp12: Cross Whisper + Speaker + F0 - adicionando prosodia a atencao cruzada
defaults: [/model]
experiment: "exp12_ex3_cross_wsf"
model_type: "cross_interaction"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
  - {name: "f0",         column: "f0_path",         dim: 1}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
