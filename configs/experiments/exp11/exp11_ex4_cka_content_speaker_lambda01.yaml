# exp11: CKA nos 5 conteudo + speaker - speaker deve ter info complementar
defaults: [/model]
experiment: "exp11_ex4_cka_content_spk_l01"
model_type: "mutual_info_reg"
embeddings:
  - {name: "whisper",    column: "whisper_path",    dim: 1280}
  - {name: "contentvec", column: "contentvec_path", dim: 768}
  - {name: "hubert",     column: "hubert_path",     dim: 768}
  - {name: "wavlm",      column: "wavlm_path",      dim: 768}
  - {name: "wav2vec2",   column: "wav2vec2_path",   dim: 768}
  - {name: "speaker",    column: "speaker_path",    dim: 192}
adapter:
  adapter_dim: 256
mlp:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1
  activation: "relu"
sigmoid_scale: true
cka_lambda: 0.1
