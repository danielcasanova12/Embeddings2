# configs/model.yaml
# Default parameters for all experiments

seed: 42
output_dim: 1

# Training parameters
train:
  batch_size: 64
  num_workers: 4
  shuffle: true

# Optimizer parameters
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.00001

# Trainer parameters (PyTorch Lightning)
trainer:
  max_epochs: 100
  accelerator: "auto"
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  accumulate_grad_batches: 1

# Checkpoint configuration
model_checkpoint:
  dirpath: "checkpoints"
  monitor: "val/spearman"
  mode: "max"
  save_last: true
  filename: "best-model-{epoch:02d}-{val/spearman:.3f}"

# Early stopping configuration
early_stopping:
  monitor: "val/spearman"
  mode: "max"
  patience: 10

# Logging configuration (Optional)
wandb:
  enabled: false
  project: "mos-embeddings"
  entity: null

# Metrics configuration
metrics:
  - "mse"
  - "pearson"
  - "spearman"
